[pytest]
# NOTE (Person A): `addopts` below is DELIBERATE and load-bearing. It is the exact
# configuration that blinded the first oracle: a default run excludes the three
# contract tests, which are the only tests that discriminate the cache-format
# change. Invariant O1 requires the oracle to run with `-m ""` and to assert that
# it collected the full inventory. Test T4 pins this behaviour: a default-marker
# run must report complete:false, an all-marker run complete:true.
addopts = -m "not contract"
testpaths = tests
markers =
    contract: end-to-end contract tests for the cache wire format (excluded by default)
    slow: tests that spawn a subprocess
